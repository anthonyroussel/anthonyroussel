name: Metrics

on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]

  # (optional) Run workflow manually
  workflow_dispatch:

  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}

# Deny all token permissions by default; jobs grant only what they need
permissions: {}

# Avoid concurrent runs racing to push the SVG
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Base
          base: header, activity, community, repositories #, metadata

          # ISO Calendar plugin
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Languages plugin
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_threshold: 2%
          commits_authoring: anthony@roussel.dev

          # Lines plugin
          plugin_lines: yes

          # Notable plugin
          plugin_notable: yes
          plugin_notable_indepth: yes
          plugin_notable_types: commit, pull_request, issue
